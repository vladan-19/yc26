<style>
  :root {
    --yc-navy: #052149;
    --yc-burgundy: #7a1f3d;
    --yc-ink: #333333;
    --yc-white: #ffffff;
    --yc-mist: #e6ebf3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--yc-white); font-family: Oswald, sans-serif; color: var(--yc-ink); }

  /* =========================================================
     Navigation
     ========================================================= */
  :root { --yc-nav-h: 8rem; }
  html { scroll-padding-top: var(--yc-nav-h); scrollbar-gutter: stable; }   /* bez pomeranja kad meni zaključa skrol */

  .yc-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    padding: 0 1.25rem;
    /* z-index se vraća tek kad meni potpuno nestane, da X animacija ostane vidljiva */
    transition: background-color .3s ease, box-shadow .3s ease, -webkit-backdrop-filter .3s ease, backdrop-filter .3s ease, z-index 0s linear .3s;
  }
  /* providna preko heroja, bela kad se skroluje */
  .yc-nav.is-scrolled {
    background: rgba(255, 255, 255, .92);
    -webkit-backdrop-filter: blur(0.75rem);
    backdrop-filter: blur(0.75rem);
    box-shadow: 0 0.75rem 2rem -26px rgba(5, 33, 73, .55);
  }

  .yc-nav__inner {
    max-width: 70rem;
    height: var(--yc-nav-h);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    transition: height .3s ease;
  }
  .yc-nav.is-scrolled .yc-nav__inner { height: 5.5rem; }

  .yc-nav__logo { display: block; flex: none; }
  .yc-nav__logo img {
    display: block;
    height: 6.5rem;
    width: auto;
    transition: height .3s ease;
  }
  .yc-nav.is-scrolled .yc-nav__logo img { height: 4.25rem; }   /* prvobitna veličina, posle skrolovanja */

  /* linkovi: isti princip kao u futeru, bazno prigušeni, na hover 100% */
  .yc-nav__links {
    display: flex;
    align-items: center;
    gap: clamp(1.25rem, 2.4vw, 2.25rem);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .yc-nav__link {
    color: var(--yc-navy);
    font-size: 1.125rem;
    font-weight: 400;
    text-decoration: none;
    opacity: .72;
    transition: opacity .25s ease;
  }
  .yc-nav__link:hover,
  .yc-nav__link:focus-visible,
  .yc-nav__link[aria-current="page"] { opacity: 1; }

  /* jezik: zastavica kao na sajtu; na hover se pretopi u zastavicu jezika na koji vodi */
  .yc-lang {
    position: relative;
    display: block;
    flex: none;
    width: 1.875rem;
    height: 1.25rem;
  }
  .yc-lang__flag {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .25s ease;
  }
  .yc-lang__flag--sr { opacity: 0; }
  .yc-lang:hover .yc-lang__flag--en,
  .yc-lang:focus-visible .yc-lang__flag--en { opacity: 0; }
  .yc-lang:hover .yc-lang__flag--sr,
  .yc-lang:focus-visible .yc-lang__flag--sr { opacity: 1; }

  .yc-nav a:focus-visible,
  .yc-nav button:focus-visible,
  .yc-menu a:focus-visible,
  .yc-menu button:focus-visible { outline: 2px solid var(--yc-burgundy); outline-offset: 4px; }

  /* dugme za meni (samo tablet i telefon) */
  .yc-nav__toggle {
    appearance: none;
    display: none;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    margin-right: -0.625rem;
    padding: 0;
    border: 0;
    background: none;
    color: var(--yc-navy);
    cursor: pointer;
  }
  .yc-burger {
    position: relative;
    display: block;
    width: 1.5rem;
    height: 1.125rem;
  }
  .yc-burger span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    border-radius: 2px;
    background: currentColor;
    transition: transform .3s ease, opacity .3s ease;
  }
  .yc-burger span:nth-child(1) { top: 0; }
  .yc-burger span:nth-child(2) { top: calc(50% - 1px); }
  .yc-burger span:nth-child(3) { bottom: 0; }
  /* u X, u istom trenutku i istom trajanju kao otvaranje/zatvaranje menija */
  .yc-nav__toggle[aria-expanded="true"] .yc-burger span:nth-child(1) { transform: translateY(0.5rem) rotate(45deg); }
  .yc-nav__toggle[aria-expanded="true"] .yc-burger span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .yc-nav__toggle[aria-expanded="true"] .yc-burger span:nth-child(3) { transform: translateY(-0.5rem) rotate(-45deg); }

  /* dok je meni otvoren, zaglavlje (logo, jezik, X) ostaje iznad njega */
  .yc-nav.is-menu-open {
    z-index: 70;
    background: transparent;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    box-shadow: none;
    transition: background-color .3s ease, box-shadow .3s ease, -webkit-backdrop-filter .3s ease, backdrop-filter .3s ease, z-index 0s;
  }

  /* --- meni preko celog ekrana --- */
  .yc-menu {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    padding: 0 1.25rem 2.5rem;
    background: linear-gradient(160deg, var(--yc-mist) 0%, var(--yc-white) 60%);
    color: var(--yc-navy);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
    overflow-y: auto;
  }
  .yc-menu.is-open {
    opacity: 1;
    visibility: visible;
    transition: opacity .3s ease;
  }
  .yc-menu__top {
    height: var(--yc-nav-h);
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .yc-menu__links {
    margin: 3rem 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 0;
  }
  /* ceo red je klikabilan, ne samo tekst; razmak između stavki je deo linka */
  .yc-menu__link {
    display: block;
    padding: 0.4375rem 0;
    color: var(--yc-navy);
    font-size: 2.125rem;
    font-weight: 500;
    line-height: 1.25;
    text-decoration: none;
    opacity: .72;
    transition: opacity .25s ease;
  }
  .yc-menu__link:hover, .yc-menu__link:focus-visible,
  .yc-menu__link[aria-current="page"] { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .yc-nav, .yc-nav__inner, .yc-nav__logo img, .yc-nav__link, .yc-lang__flag,
    .yc-menu, .yc-menu__link, .yc-burger span { transition: none; }
  }

  @media (max-width: 991px) {
    :root { --yc-nav-h: 6rem; }
    .yc-nav__logo img { height: 4.75rem; }
    .yc-nav.is-scrolled .yc-nav__inner { height: 4.5rem; }
    .yc-nav.is-scrolled .yc-nav__logo img { height: 3.5rem; }
    .yc-nav__inner { gap: 1.25rem; }
    .yc-nav__inner > nav { margin-left: auto; }
    .yc-nav__links > li:not(.yc-nav__lang-item):not(.yc-nav__search-item) { display: none; }
    .yc-nav .yc-lang { width: 1.6875rem; height: 1.125rem; }   /* ista visina kao hamburger */
    .yc-nav__toggle { display: inline-flex; }
  }
  @media (max-width: 480px) {
    .yc-nav, .yc-menu { padding-left: 1rem; padding-right: 1rem; }
    .yc-menu__link { font-size: 1.875rem; }
  }
</style>

<script>
  /* Navigation: white background after scrolling + menu for tablet and phone */
  (function () {
    var nav = document.querySelector('.yc-nav');
    var menu = document.getElementById('yc-menu');
    if (!nav || !menu) return;
    var openBtn = nav.querySelector('.yc-nav__toggle');

    function onScroll() { nav.classList.toggle('is-scrolled', window.scrollY > 8); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    function openMenu() {
      menu.classList.add('is-open');
      nav.classList.add('is-menu-open');
      openBtn.setAttribute('aria-expanded', 'true');
      openBtn.setAttribute('aria-label', 'Close menu');
      document.documentElement.style.overflow = 'hidden';
    }
    function closeMenu() {
      if (!menu.classList.contains('is-open')) return;
      menu.classList.remove('is-open');
      nav.classList.remove('is-menu-open');
      openBtn.setAttribute('aria-expanded', 'false');
      openBtn.setAttribute('aria-label', 'Open menu');
      document.documentElement.style.overflow = '';
      openBtn.focus();
    }

    openBtn.addEventListener('click', function () {
      if (menu.classList.contains('is-open')) closeMenu(); else openMenu();
    });
    menu.addEventListener('click', function (e) { if (e.target.closest('a')) closeMenu(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
    window.matchMedia('(min-width: 992px)').addEventListener('change', function (e) { if (e.matches) closeMenu(); });
  })();
</script>
